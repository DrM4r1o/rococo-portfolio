<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <radialGradient id="cmp-bg" cx="50%" cy="42%" r="70%">
            <stop offset="0%" stop-color="#2a4e42" />
            <stop offset="100%" stop-color="#12221b" />
        </radialGradient>
        <linearGradient id="cmp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff0d0" />
            <stop offset="100%" stop-color="#ffdca8" />
        </linearGradient>
        <linearGradient id="cmp-shade" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9a7b4f" />
            <stop offset="100%" stop-color="#553f1f" />
        </linearGradient>
        <g id="cmp-point">
            <polygon fill="url(#cmp-gold)" points="64,8 77,49 64,64 51,49" />
            <polygon fill="url(#cmp-shade)" points="64,8 64,64 51,49" />
        </g>
    </defs>

    <circle cx="64" cy="64" r="64" fill="url(#cmp-bg)" />
    <circle cx="64" cy="64" r="60" fill="none" stroke="#c5a869" stroke-width="1.5" opacity="0.5" />
    <circle cx="64" cy="64" r="55" fill="none" stroke="#c5a869" stroke-width="2.5" />

    <g opacity="0.9">
        <use href="#cmp-point" transform="rotate(45 64 64) translate(64 64) scale(0.58) translate(-64 -64)" />
        <use href="#cmp-point" transform="rotate(135 64 64) translate(64 64) scale(0.58) translate(-64 -64)" />
        <use href="#cmp-point" transform="rotate(225 64 64) translate(64 64) scale(0.58) translate(-64 -64)" />
        <use href="#cmp-point" transform="rotate(315 64 64) translate(64 64) scale(0.58) translate(-64 -64)" />
    </g>

    <use href="#cmp-point" />
    <use href="#cmp-point" transform="rotate(90 64 64)" />
    <use href="#cmp-point" transform="rotate(180 64 64)" />
    <use href="#cmp-point" transform="rotate(270 64 64)" />

    <circle cx="64" cy="64" r="10" fill="#755a31" />
    <circle cx="64" cy="64" r="9" fill="url(#cmp-gold)" />
    <circle cx="64" cy="64" r="4.5" fill="#24473c" />
    <circle cx="64" cy="64" r="1.6" fill="#fff0d0" />
